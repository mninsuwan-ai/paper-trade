name: Update paper-trade portfolio

on:
  schedule:
    # GitHub does not guarantee scheduled runs: jobs queued on the hour or half hour sit in the
    # busiest slots and can be delayed for hours or dropped entirely. So: odd minutes, and a
    # second attempt later in the day. The job is idempotent, running twice changes nothing.
    #
    # 01:07 UTC Tue-Sat = 08:07 Thai time, after Mon-Fri US closes.
    - cron: "7 1 * * 2-6"
    # 05:23 UTC Tue-Sat = 12:23 Thai time - safety net if the first slot was dropped.
    - cron: "23 5 * * 2-6"
  workflow_dispatch: {}        # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: ["build.py", "update.py", "portfolio.json", ".github/workflows/update.yml"]

permissions:
  contents: write   # commit the refreshed portfolio.json / index.html back to main
  pages: write      # publish to GitHub Pages
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: paper-trade
  cancel-in-progress: false

# Settings -> Pages -> Source must be "GitHub Actions" (not "Deploy from a branch").
# The deploy job below is what actually publishes the site; committing index.html to
# main only keeps the repo in sync, it does NOT update the published page on its own.

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probe price sources
        continue-on-error: true
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python3 update.py --probe

      - name: Fetch prices and update portfolio
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python3 update.py

      - name: Rebuild dashboard
        run: python3 build.py

      - name: Commit and publish
        run: |
          git config user.name  "paper-trade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- portfolio.json index.html; then
            echo "No changes to commit."
            exit 0
          fi

          git add portfolio.json index.html
          git commit -m "chore: update portfolio $(date -u +'%Y-%m-%d')"

          # The runner may have checked out a commit that is no longer the tip of main
          # (a manual push landing while the job was queued). Rebase onto whatever is
          # there now and retry rather than failing the whole run on a rejected push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing onto origin/main (attempt $attempt)..."
            git fetch origin main
            # Our commit only touches generated files, so on a conflict ours always wins.
            git rebase -X ours origin/main || {
              git rebase --abort || true
              echo "Rebase failed."
              exit 1
            }
          done
          echo "Could not push after 3 attempts."
          exit 1

      - name: Summary
        run: |
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open("portfolio.json"))
          start = d["start_cash"]
          if d["status"] != "open":
              print(f"### Buy not executed yet\n\nWaiting on the {d['entry_date']} open. "
                    "See the log above for which tickers are missing.")
          else:
              total = sum((p["last"] or p["entry"]) * p["shares"] for p in d["positions"]) + d["cash"]
              pl = total - start
              print(f"### Portfolio: ${total:,.2f}  ({pl:+,.2f} / {pl/start*100:+.2f}%)\n")
              print(f"Prices as of **{d['last_price_date']}**\n")
              print("| Ticker | Entry | Last | P/L % |")
              print("|---|---|---|---|")
              for p in sorted(d["positions"],
                              key=lambda x: -((x["last"] or x["entry"]) / x["entry"] - 1)):
                  chg = ((p["last"] or p["entry"]) / p["entry"] - 1) * 100
                  print(f"| {p['ticker']} | {p['entry']:.2f} | {p['last']:.2f} | {chg:+.2f}% |")
          PY

      - name: Package site for Pages
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp portfolio.json _site/portfolio.json
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # This job is what actually publishes the dashboard. Without it the page never
  # changes, no matter how many times index.html is committed to main.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show the live URL
        run: |
          echo "::notice title=Dashboard published::${{ steps.deployment.outputs.page_url }}"
          echo "Dashboard: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
