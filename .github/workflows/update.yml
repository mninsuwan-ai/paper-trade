name: Update paper-trade portfolio

on:
  schedule:
    # 22:07 UTC Mon-Fri = 05:07 Thai time the next morning.
    #
    # The US close is 20:00 UTC in summer / 21:00 in winter, so the data is already out.
    # Running here rather than at 01:07 UTC leaves about three hours of slack before
    # anyone looks at the page over breakfast in Bangkok - GitHub routinely runs cron
    # jobs late, and a slot that lands minutes before you check looks like a failure.
    #
    # Deliberately ONE slot only. Alpha Vantage's free tier allows 25 requests a day and a
    # single run spends about 23, so a second scheduled slot would blow the quota and make
    # the later run fail on every ticker. The odd minute is also deliberate: GitHub queues
    # cron jobs set to :00 and :30 in its busiest slots, where they get delayed or dropped.
    - cron: "7 22 * * 1-5"
  workflow_dispatch: {}        # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: ["build.py", "update.py", "portfolios/**", ".github/workflows/update.yml"]

permissions:
  contents: write   # commit the refreshed portfolio.json / index.html back to main
  pages: write      # publish to GitHub Pages
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: paper-trade
  cancel-in-progress: false

# Settings -> Pages -> Source must be "GitHub Actions" (not "Deploy from a branch").
# The deploy job below is what actually publishes the site; committing index.html to
# main only keeps the repo in sync, it does NOT update the published page on its own.

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probe price sources
        continue-on-error: true
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python3 update.py --probe

      - name: Fetch prices and update portfolio
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python3 update.py

      - name: Rebuild dashboard
        run: python3 build.py

      - name: Commit and publish
        run: |
          git config user.name  "paper-trade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A portfolios *.html portfolio.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update portfolios $(date -u +'%Y-%m-%d')"

          # The runner may have checked out a commit that is no longer the tip of main
          # (a manual push landing while the job was queued). Rebase onto whatever is
          # there now and retry rather than failing the whole run on a rejected push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing onto origin/main (attempt $attempt)..."
            git fetch origin main
            # Our commit only touches generated files, so on a conflict ours always wins.
            git rebase -X ours origin/main || {
              git rebase --abort || true
              echo "Rebase failed."
              exit 1
            }
          done
          echo "Could not push after 3 attempts."
          exit 1

      - name: Summary
        run: |
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import glob, json
          for f in sorted(glob.glob("portfolios/*.json")):
              d = json.load(open(f, encoding="utf-8"))
              name = d.get("name", f)
              if d["status"] != "open":
                  print(f"### {name}: not opened yet\n")
                  print(f"Waiting on the {d['entry_date']} open.\n")
                  continue
              start = d["start_cash"]
              total = sum((p["last"] or p["entry"]) * p["shares"] for p in d["positions"]) + d["cash"]
              pl = total - start
              print(f"### {name}: ${total:,.2f}  ({pl:+,.2f} / {pl/start*100:+.2f}%)\n")
              bm, base = d.get("benchmark") or {}, d.get("track_base")
              if bm.get("entry") and bm.get("last") and base:
                  br = (bm["last"] * bm["shares"] / base - 1) * 100
                  sr = (total / base - 1) * 100
                  print(f"Since {d.get('track_since')}: portfolio **{sr:+.2f}%** vs "
                        f"S&P 500 **{br:+.2f}%** &rarr; **{sr-br:+.2f} pts**\n")
              print(f"Prices as of **{d['last_price_date']}**\n")
              print("| Ticker | Entry | Last | P/L % |")
              print("|---|---|---|---|")
              for p in sorted(d["positions"],
                              key=lambda x: -((x["last"] or x["entry"]) / x["entry"] - 1)):
                  chg = ((p["last"] or p["entry"]) / p["entry"] - 1) * 100
                  print(f"| {p['ticker']} | {p['entry']:.2f} | {p['last']:.2f} | {chg:+.2f}% |")
              print()
          PY

      - name: Package site for Pages
        run: |
          mkdir -p _site/portfolios
          cp *.html _site/
          cp portfolios/*.json _site/portfolios/
          touch _site/.nojekyll
          ls -laR _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # This job is what actually publishes the dashboard. Without it the page never
  # changes, no matter how many times index.html is committed to main.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show the live URL
        run: |
          echo "::notice title=Dashboard published::${{ steps.deployment.outputs.page_url }}"
          echo "Dashboard: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
